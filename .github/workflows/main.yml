name: Postman API Tests with Local Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Project Dependencies
        run: |
          npm install

      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Start Local Backend Server in Background
        run: |
          npm run tern-on-api &
          sleep 5

      - name: Run Postman Tests via Newman and Generate Index
        run: |
          mkdir -p public
          newman run store.collection.json -r htmlextra --reporter-htmlextra-export public/store.html --reporter-htmlextra-darkTheme --suppress-exit-code
          newman run petstore.collection.json -r htmlextra --reporter-htmlextra-export public/petstore.html --reporter-htmlextra-darkTheme --suppress-exit-code

          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Postman Test Reports</title>
            <style>
              body { font-family: Arial, sans-serif; padding: 40px; background: #1a1a1a; color: #fff; }
              h1 { color: #00d2ff; }
              ul { list-style: none; padding: 0; }
              li { margin: 15px 0; }
              a { font-size: 18px; color: #4db8ff; text-decoration: none; border: 1px solid #4db8ff; padding: 10px 20px; border-radius: 5px; display: inline-block; }
              a:hover { background: #4db8ff; color: #000; }
            </style>
          </head>
          <body>
            <h1>Results execution Postman tests</h1>
            <ul>
              <li><a href="store.html" target="_blank">Report: Store Collection</a></li>
              <li><a href="petstore.html" target="_blank">Report: Petstore Collection</a></li>
            </ul>
          </body>
          </html>
          EOF
      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false
